name: guard

# 本機同 CI 跑同一條：node scripts/guard.mjs（S12 / F14）
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # 每週一 HKT 11:17 定時掃，防止「靜靜變肥」

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A16：外部 Actions 釘死 40-hex commit SHA，保留版號註解供 Dependabot 識別
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Guard（S / F / A / W / V / G / A16 / F15 / SEO）
        run: node scripts/guard.mjs --ci

      - name: 全套單元與合約測試（smoke ＋ transit parser／publisher）
        run: npm test

      - name: 資料一致性掃描（用詞／AFCD・康文署連結／NO_MERGE）
        run: npm run audit

      - name: 安裝臨時 DOM 模擬器並跑 A–Y 多身份 UI 實測
        run: |
          npm install --no-save --no-package-lock jsdom@^26
          npm run ui
