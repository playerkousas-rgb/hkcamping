name: Camp Data Sync

# 每日 00:30 HKT = 16:30 UTC（前一日）；GitHub Actions cron 一律用 UTC
# 手動觸發：Actions → Camp Data Sync → Run workflow
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camp-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A16：外部 Actions 釘死 40-hex commit SHA，保留版號註解供 Dependabot 識別
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # 任一步 fetch 失敗都會 exit 1（工具本身 fail-closed，保留舊快照）
      - name: 漁護署 41 營地快照 + 差異報告（CSDI）
        run: node tools-sync-afcd.mjs

      - name: 天文台警告 + 九天預報快照
        run: node tools-sync-weather.mjs

      - name: 該區天氣 + 潮汐官方快照（rhrread ＋ HLT）
        run: node tools-sync-conditions.mjs

      - name: 天文台 OCF 自動分區九日預報（12 站）
        run: node tools-sync-ocf.mjs

      - name: 重建 data.js（data.csv ＋ weather ＋ conditions ＋ ocf → data.js）
        run: node build-data.mjs

      - name: 有變更先 commit，無變更靜默
        run: |
          git add data/auto/afcd-campsites.json data/auto/afcd-diff-report.md data/auto/weather.json data/auto/conditions.json data/auto/ocf-forecast.json data.js
          if git diff --cached --quiet; then
            echo "✅ 官方數據與天氣無實質變更，跳過 commit"
            exit 0
          fi
          git config user.name "hk-camp-bot"
          git config user.email "hk-camp-bot@users.noreply.github.com"
          git commit -m "chore(data): 每日官方營地／天氣快照同步"
          git push
