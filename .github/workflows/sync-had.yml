name: HAD Guesthouse Sync

# 每月 2 號 01:15 HKT = 每月 1 號 17:15 UTC；GitHub Actions cron 一律用 UTC
# 只寫 data/auto/had-*，永遠唔改 data.csv（來源隔離原則）
on:
  schedule:
    - cron: '15 17 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: had-guesthouse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A16：外部 Actions 釘死 40-hex commit SHA，保留版號註解供 Dependabot 識別
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: 持牌賓館＋青年旅舍會社證快照（CSDI LLHG ＋ CLUB ＋ HAD CSV）
        run: node tools-sync-had.mjs

      - name: 只 commit had-* 快照，無變更靜默
        run: |
          git add data/auto/had-guesthouses.json data/auto/had-yha-clubs.json data/auto/had-candidates.json data/auto/had-diff-report.md
          if git diff --cached --quiet; then
            echo "✅ 持牌賓館名單無變更，跳過 commit"
            exit 0
          fi
          git config user.name "hk-camp-bot"
          git config user.email "hk-camp-bot@users.noreply.github.com"
          git commit -m "chore(data): 每月持牌賓館名單同步"
          git push
